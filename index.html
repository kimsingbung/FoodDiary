<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>냠냠일기</title>
  <meta name="theme-color" content="#e8743b">
  <!-- iPhone '홈 화면에 추가' 시 앱처럼 열리도록 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="냠냠일기">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="loading" class="screen center"><p class="muted">불러오는 중…</p></div>

  <section id="setup-screen" class="screen center hidden">
    <div class="login-card">
      <div class="logo-big">🛠️</div>
      <h1>설정이 필요해요</h1>
      <p><code>js/config.js</code> 에 Firebase 설정값과 카카오 JavaScript 키를 넣어주세요. 자세한 방법은 README를 참고하세요.</p>
    </div>
  </section>

  <section id="login-screen" class="screen center hidden">
    <div class="login-card">
      <div class="logo-big">🍚</div>
      <h1>냠냠일기</h1>
      <p>우리 둘의 맛집 지도</p>
      <button id="login-btn" class="btn primary wide">Google로 로그인</button>
    </div>
  </section>

  <section id="denied-screen" class="screen center hidden">
    <div class="login-card">
      <div class="logo-big">🔒</div>
      <h1>초대받지 않은 계정이에요</h1>
      <p id="denied-email"></p>
      <button id="denied-logout" class="btn wide">다른 계정으로 로그인</button>
    </div>
  </section>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">🍚 냠냠일기</div>
      <nav class="tabs">
        <button class="tab active" data-view="map">지도</button>
        <button class="tab" data-view="list">리스트</button>
        <button class="tab" data-view="album">앨범</button>
      </nav>
      <button id="me-btn" class="avatar-btn" title="로그아웃"></button>
    </header>

    <section id="map-view" class="view">
      <div id="map"></div>
      <div id="map-summary" class="map-summary"></div>
      <button id="map-locate" class="locate-btn" aria-label="내 위치로 이동"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M21 3 3 10.5l7.6 2.9L13.5 21z"/></svg><span>내 위치</span></button>
      <div id="map-empty" class="map-empty hidden">아직 기록한 맛집이 없어요<br><b>+</b> 버튼으로 첫 맛집을 남겨보세요 🍜</div>
    </section>

    <main id="list-view" class="view page hidden">
      <div class="toolbar">
        <h2>방문 기록</h2>
        <div class="seg"><button data-group="month">월별</button><button data-group="year">연도별</button></div>
      </div>
      <div id="list"></div>
    </main>

    <main id="album-view" class="view page hidden">
      <div class="toolbar">
        <h2>앨범</h2>
        <div class="seg"><button data-group="month">월별</button><button data-group="year">연도별</button></div>
      </div>
      <div id="album"></div>
    </main>

    <button id="fab" class="fab" aria-label="맛집 기록 추가">+</button>
  </div>

  <!-- 방문 기록 추가/수정 -->
  <dialog id="form-dialog">
    <form id="visit-form" class="sheet">
      <button type="button" class="close-x" data-close aria-label="닫기">✕</button>
      <h2 id="form-title">맛집 기록</h2>

      <div class="field">사진 <span id="photo-hint" class="hint"></span>
        <div id="photo-strip" class="photo-strip"></div>
      </div>

      <div class="field">가게
        <div id="place-picked" class="place-picked hidden"></div>
        <div id="place-search">
          <div class="search-row">
            <input id="place-q" placeholder="가게 이름 검색 (예: 을지로 노가리)" enterkeyhint="search" autocomplete="off">
            <button type="button" id="place-go" class="btn small">검색</button>
          </div>
          <div class="place-tools">
            <button type="button" id="place-near" class="chip">📍 내 주변 가게</button>
            <button type="button" id="place-pick" class="chip">🗺️ 지도에서 직접 찍기</button>
          </div>
          <div id="place-results" class="place-results"></div>
        </div>
      </div>

      <label>날짜 <input type="date" id="f-date" required></label>

      <div class="field">메뉴 · 가격
        <div id="menu-rows"></div>
        <div class="menu-foot">
          <button type="button" id="menu-add" class="link">+ 메뉴 추가</button>
          <span id="menu-total"></span>
        </div>
      </div>

      <div class="field">내 평점 · 후기
        <span id="f-rating" class="rating-input" data-value="0"></span>
        <textarea id="f-review" rows="3" maxlength="500" placeholder="맛은 어땠어요? 또 올 거예요?"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn" data-close>취소</button>
        <button type="submit" id="form-save" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 지도에서 직접 위치 찍기 -->
  <dialog id="picker-dialog">
    <div class="sheet">
      <button type="button" class="close-x" data-close aria-label="닫기">✕</button>
      <h2>지도에서 위치 찍기</h2>
      <div class="search-row">
        <input id="pk-q" placeholder="주소·지역·상호로 지도 이동 (예: 망원동 412)" enterkeyhint="search" autocomplete="off">
        <button type="button" id="pk-go" class="btn small">이동</button>
      </div>
      <div class="picker-map-wrap">
        <div id="picker-map"></div>
        <div class="crosshair" aria-hidden="true">📍</div>
        <button type="button" id="pk-locate" class="locate-btn" aria-label="내 위치로 이동"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M21 3 3 10.5l7.6 2.9L13.5 21z"/></svg><span>내 위치</span></button>
      </div>
      <p class="muted small">지도를 움직여서 핀을 정확한 위치에 맞춰주세요</p>
      <div id="pk-addr" class="pk-addr"></div>
      <label>가게 이름 <input id="pk-name" maxlength="40" placeholder="예: 망원시장 꽈배기 노점" autocomplete="off"></label>
      <div class="form-actions">
        <button type="button" class="btn" data-close>취소</button>
        <button type="button" id="pk-ok" class="btn primary">이 위치로 선택</button>
      </div>
    </div>
  </dialog>

  <dialog id="visit-dialog"></dialog>
  <dialog id="place-dialog"></dialog>

  <div id="toast" popover="manual"></div>
</body>
</html>
