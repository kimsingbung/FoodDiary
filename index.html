<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>냠냠 일기</title>
  <meta name="theme-color" content="#e8743b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="loading" class="screen center"><p class="muted">불러오는 중…</p></div>

  <section id="setup-screen" class="screen center hidden">
    <div class="login-card">
      <div class="logo-big">🛠️</div>
      <h1>Firebase 설정이 필요해요</h1>
      <p><code>js/firebase-config.js</code> 파일에 Firebase 웹 앱 설정값을 넣어주세요. 자세한 방법은 README를 참고하세요.</p>
    </div>
  </section>

  <section id="login-screen" class="screen center hidden">
    <div class="login-card">
      <div class="logo-big">🍚</div>
      <h1>냠냠 일기</h1>
      <p>우리 둘의 음식 기록</p>
      <button id="login-btn" class="btn primary wide">Google로 로그인</button>
    </div>
  </section>

  <section id="denied-screen" class="screen center hidden">
    <div class="login-card">
      <div class="logo-big">🔒</div>
      <h1>초대받지 않은 계정이에요</h1>
      <p id="denied-email"></p>
      <button id="denied-logout" class="btn wide">다른 계정으로 로그인</button>
    </div>
  </section>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">🍚 냠냠 일기</div>
      <nav class="tabs">
        <button class="tab active" data-view="calendar">캘린더</button>
        <button class="tab" data-view="feed">피드</button>
      </nav>
      <button id="me-btn" class="avatar-btn" title="로그아웃"></button>
    </header>

    <main>
      <section id="calendar-view">
        <div>
          <div class="cal-head">
            <button id="prev-month" class="icon-btn" aria-label="이전 달">‹</button>
            <h2 id="month-label"></h2>
            <button id="next-month" class="icon-btn" aria-label="다음 달">›</button>
            <button id="today-btn" class="btn small">오늘</button>
          </div>
          <div class="cal-weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
          <div id="cal-grid" class="cal-grid"></div>
          <div class="legend"><span><i class="dot"></i> 내 기록</span><span><i class="dot partner"></i> 상대 기록</span></div>
        </div>
        <div class="day-panel">
          <div class="day-panel-head">
            <h3 id="day-label"></h3>
            <button id="add-for-day" class="btn small primary">+ 기록</button>
          </div>
          <div id="day-list"></div>
        </div>
      </section>

      <section id="feed-view" class="hidden">
        <div id="feed-list" class="feed"></div>
        <button id="feed-more" class="btn wide feed-more hidden">더 보기</button>
      </section>
    </main>

    <button id="fab" class="fab" aria-label="기록 추가">+</button>
  </div>

  <dialog id="entry-dialog">
    <form id="entry-form">
      <h2 id="entry-heading">기록 추가</h2>
      <label class="photo-pick">
        <input type="file" id="photo-input" accept="image/*" hidden>
        <img id="photo-preview" alt="" hidden>
        <span id="photo-placeholder">📷 사진 선택</span>
      </label>
      <div class="row">
        <label>날짜 <input type="date" id="f-date" required></label>
        <label>식사
          <select id="f-meal">
            <option>아침</option><option>점심</option><option>저녁</option><option>간식</option><option>야식</option>
          </select>
        </label>
      </div>
      <label>메뉴 <input id="f-title" maxlength="60" placeholder="예) 김치찌개" required></label>
      <label>장소 <input id="f-place" maxlength="60" placeholder="집, 식당 이름 등 (선택)"></label>
      <div class="field">별점
        <span id="f-rating" class="rating-input">
          <button type="button" data-v="1">★</button><button type="button" data-v="2">★</button><button type="button" data-v="3">★</button><button type="button" data-v="4">★</button><button type="button" data-v="5">★</button>
        </span>
      </div>
      <label>메모 <textarea id="f-memo" rows="3" maxlength="1000" placeholder="맛, 같이 먹은 사람, 그날의 기분…"></textarea></label>
      <div class="form-actions">
        <button type="button" id="entry-cancel" class="btn">취소</button>
        <button type="submit" id="entry-save" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="detail-dialog"></dialog>

  <div id="toast" popover="manual"></div>
</body>
</html>
